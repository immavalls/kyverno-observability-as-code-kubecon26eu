apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-standalone
  namespace: argocd
spec:
  project: default
  sources:
    # Source 1: Remote Helm Chart
    - repoURL: https://grafana-community.github.io/helm-charts
      chart: grafana
      targetRevision: 10.5.15
      helm:
        values: |
          adminPassword: admin
          
          # Provision the data source directly here to avoid mount errors
          datasources:
            datasources.yaml:
              apiVersion: 1
              datasources:
                - name: kyverno-prometheus-ds
                  type: prometheus
                  url: http://prometheus-server.kyverno.svc.cluster.local:9090
                  access: proxy
                  isDefault: true
                  # UID matching the dashboard JSON
                  uid: kyverno-prometheus-ds
                - name: Tempo
                  type: tempo
                  url: http://tempo.kyverno.svc.cluster.local:3200
                  access: proxy
                  uid: tempo-datasource

          sidecar:
            dashboards:
              enabled: true
              label: grafana_dashboard
              labelValue: "1"
              searchNamespace: ALL
            alerts:
              enabled: true
              label: grafana_alert
              labelValue: "1"
              searchNamespace: ALL
          
          dashboards:
            default:
              kyverno-dashboard:
                # Use the ref from Source 2 to pull the content
                json: |
                  {{ "{{" }} .Files.Get "$data-repo/apps/grafana/provision/kyverno-dashboard.json" {{ "}}" }}
          extraConfigMaps:
            kyverno-alerts-provisioning:
              labels:
                grafana_alert: "1" # Matches the sidecar label above
              data:
                # Use the $data-repo reference to pull the file
                alerts.yaml: |
                  {{ "{{" }} .Files.Get "$data-repo/apps/grafana/provision/kyverno-alerts.yaml" {{ "}}" }}
    # Source 2: Git Repo
    - repoURL: file:///usr/local/repo
      targetRevision: HEAD
      ref: data-repo 

  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true