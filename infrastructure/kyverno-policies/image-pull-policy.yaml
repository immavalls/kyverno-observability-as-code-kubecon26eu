apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: force-if-not-present
spec:
  background: false
  rules:
  - name: set-image-pull-policy
    match:
      any:
      - resources:
          kinds:
          - Pod
    mutate:
      patchStrategicMerge:
        spec:
          containers:
          - (name): "*"
            imagePullPolicy: IfNotPresent