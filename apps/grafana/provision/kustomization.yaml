apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kyverno
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  # Picked up by the Grafana dashboards sidecar (label grafana_dashboard)
  - name: kyverno-dashboard
    files:
      - kyverno-dashboard.json
    options:
      labels:
        grafana_dashboard: "1"
  # Picked up by the Grafana alerts sidecar (label grafana_alert)
  - name: kyverno-alerts
    files:
      - kyverno-alerts.yaml
    options:
      labels:
        grafana_alert: "1"
