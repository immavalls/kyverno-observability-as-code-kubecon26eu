apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno-policies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5" # Ensures policies start after kyverno app
spec:
  project: default
  source:
    repoURL: file:///usr/local/repo # e.g., https://github.com/your-user/your-repo.git
    targetRevision: HEAD
    path: infrastructure/kyverno-policies
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - Replace=true